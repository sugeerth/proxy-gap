name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  reproduce:
    # The claim this repo makes is that every number regenerates from source.
    # This job is what keeps that claim true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Closed form vs Monte Carlo
        run: python -m proxygap.cli verify
      - name: Regenerate every figure
        run: python -m proxygap.cli all --out site/data
      - name: Fail if any artifact did not build
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("site/data/manifest.json"))
          bad = [k for k, v in m["artifacts"].items() if not v["ok"]]
          if bad:
              for k in bad:
                  print(f"::error::artifact {k} failed: {m['artifacts'][k]['error']}")
              sys.exit(1)
          print(f"all {len(m['artifacts'])} artifacts rebuilt")
          PY
