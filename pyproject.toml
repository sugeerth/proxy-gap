[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxygap"
version = "0.1.0"
description = "An evaluation-driven post-training research platform: measure judge bias, predict reward hacking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sugeerth Murugesan" }]
keywords = ["llm-evaluation", "reward-hacking", "goodhart", "post-training", "benchmarks"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
proxygap = "proxygap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
